<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120">
  <rect width="520" height="120" fill="#08090a" rx="8"/>
  <!-- Geometric overlapping circles -->
  <g transform="translate(36, 24)">
    <!-- Outer circle -->
    <circle cx="36" cy="36" r="34" fill="none" stroke="#35d0e0" stroke-width="2.5" opacity="0.6"/>
    <!-- Inner overlapping circle -->
    <circle cx="36" cy="36" r="22" fill="none" stroke="#35d0e0" stroke-width="2" opacity="0.9"/>
    <!-- Central dot -->
    <circle cx="36" cy="36" r="7" fill="#35d0e0"/>
    <!-- Scan line -->
    <line x1="4" y1="36" x2="68" y2="36" stroke="#35d0e0" stroke-width="1.5" opacity="0.5"/>
  </g>
  <!-- Wordmark -->
  <text x="300" y="78" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="600" fill="#f0f0f0" text-anchor="middle" letter-spacing="-1.5">markee</text>
</svg>
